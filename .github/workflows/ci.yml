name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: versions
        run: node --version && python3 --version

      - name: matcher tests
        working-directory: services/matcher
        run: python3 -m unittest discover -s test -v

      - name: api tests
        working-directory: services/api
        run: node --test test/*.test.ts

      - name: scout tests
        working-directory: services/scout
        run: python3 -m unittest discover -s test -v

      - name: end to end
        run: ./scripts/demo.sh

      - name: no contact details in fixtures
        run: |
          # A cheap guard against someone committing real personal data as test
          # data. 555 numbers and example.com are fine; anything else is not.
          if grep -rInE '(\+[0-9]{1,3}[ .-]?)?\(?[2-9][0-9]{2}\)?[ .-][2-9][0-9]{2}[ .-][0-9]{4}' \
               --include='*.json' --include='*.ts' --include='*.py' --include='*.md' . \
             | grep -vE '555|example\.(com|test)|127\.0\.0\.1' ; then
            echo "::error::found a phone-number-shaped string that is not a 555 placeholder"
            exit 1
          fi
          echo "fixtures look clean"
